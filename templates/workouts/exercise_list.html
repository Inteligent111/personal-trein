{% extends "base.html" %}

{% block title %}Каталог упражнений{% endblock %}

{% block content %}
<h1 class="mb-4">Каталог упражнений</h1>
    <div class="row g-3">
        {% for exercise in exercises %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ exercise.title }}</h5>
                        <p class="card-text text-muted">{{ exercise.get_muscle_group_display }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
    
{%endblock %}
