{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-danger shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Удаление тренировки</h4>
                </div>
                <div class="card-body text-center">
                    <p class="fs-5">
                        Вы уверены, что хотите безвозвратно удалить тренировку <br>
                        <strong>«{{ object.name }}»</strong> от {{ object.date }}?
                    </p>
                    <p class="text-muted small">Все подходы и упражнения внутри этой тренировки также будут удалены.</p>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-around">
                            <a href="{% url 'workouts:workout_detail' object.pk %}" class="btn btn-secondary">
                                Нет, назад
                            </a>
                            <button type="submit" class="btn btn-danger">
                                Да, удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
