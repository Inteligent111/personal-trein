{% extends 'base.html' %}
    
{% block title %}Мои тренировки{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Мои тренировки</h1>

    <div class="row g-3">
        {% for workout in workouts %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-primary mb-2">
                            {{ workout.name }}
                        </h5>
                        <div class="mt-3">
                            <a href="{% url 'workouts:workout_detail' pk=workout.pk %}" class="btn btn-sm btn-outline-primary">Открыть тренировку</a>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info">
                    У вас еще нет добавленных тренировок.
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
